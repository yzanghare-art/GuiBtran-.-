<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Btran ❤️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
        }

        /* Nền hình ảnh hoa ly */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.7);
            z-index: 1;
        }

        /* Trái tim rơi */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 2;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) scale(0); opacity: 1; }
            100% { transform: translateY(105vh) scale(1.5); opacity: 0; }
        }

        /* Khung hiển thị */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            color: #d63384;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        /* Vùng chứa 2 nút */
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 80px;
            position: relative;
        }

        .btn-action-main {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            outline: none;
            display: inline-block;
            white-space: nowrap;
        }

        #btn-yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.4);
            z-index: 11;
        }

        #btn-no {
            background-color: #6c757d;
            color: white;
            z-index: 12;
            transition: transform 0.15s ease-out;
        }

        /* Khung nhập nội dung */
        #letter-view {
            display: none;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 10px;
            resize: none;
            font-size: 0.95rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .btn-save {
            background: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        #letter-display {
            font-size: 1.05rem;
            color: #333;
            line-height: 1.5;
            margin-bottom: 15px;
            white-space: pre-wrap;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        #qrcode {
            margin-top: 15px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>

    <div class="container" id="question-view">
        <h1>Btran có iu tui hong? ❤️</h1>
        <div class="btn-group">
            <button id="btn-yes" class="btn-action-main">Dạ có 🥰</button>
            <button id="btn-no" class="btn-action-main">Hong 😜</button>
        </div>
    </div>

    <div class="container" id="letter-view">
        <h1 style="font-size: 1.3rem;">Gửi Btran của tui 💌</h1>
        
        <div id="letter-display"></div>

        <div id="admin-panel">
            <textarea id="letter-text" placeholder="Nhập lời tâm tư của bạn..."></textarea>
            <input type="text" id="bg-url-input" placeholder="Dán link ảnh hoa ly vào đây">
            <button class="btn-save" id="btn-save-qr">Lưu & Tạo mã QR gửi cô ấy</button>
        </div>

        <div id="qrcode"></div>
    </div>

    <script>
        const DEFAULT_BG = "https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?q=80&w=1000&auto=format&fit=crop";
        const DEFAULT_TEXT = "Cảm ơn em vì đã đồng ý! Yêu em nhiều lắm ❤️";

        const urlParams = new URLSearchParams(window.location.search);
        const customText = urlParams.get('msg');
        const customBg = urlParams.get('bg');

        const activeBg = customBg ? decodeURIComponent(customBg) : DEFAULT_BG;
        const activeText = customText ? decodeURIComponent(customText) : DEFAULT_TEXT;

        document.getElementById('bg-image').style.backgroundImage = `url('${activeBg}')`;
        document.getElementById('letter-display').innerText = activeText;
        document.getElementById('letter-text').value = activeText;
        document.getElementById('bg-url-input').value = activeBg;

        if(customText) {
            document.getElementById('admin-panel').style.display = 'none';
        }

        // Tạo hiệu ứng trái tim
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }, 300);

        // Nút "Hong" chạy trốn
        const btnNo = document.getElementById('btn-no');
        let scale = 1;
        let count = 0;

        function moveButton() {
            count++;
            scale -= 0.18;
            
            if (count >= 5 || scale <= 0.2) {
                btnNo.style.display = 'none';
                return;
            }

            const x = (Math.random() - 0.5) * 200;
            const y = (Math.random() - 0.5) * 200;
            const rot = (Math.random() - 0.5) * 180;

            btnNo.style.transform = `translate(${x}px, ${y}px) scale(${scale}) rotate(${rot}deg)`;
        }

        btnNo.addEventListener('touchstart', moveButton);
        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('click', moveButton);

        // Nút "Dạ có"
        document.getElementById('btn-yes').addEventListener('click', () => {
            confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            document.getElementById('question-view').style.display = 'none';
            document.getElementById('letter-view').style.display = 'block';
        });

        // Tạo mã QR
        document.getElementById('btn-save-qr').addEventListener('click', () => {
            const text = encodeURIComponent(document.getElementById('letter-text').value);
            const bg = encodeURIComponent(document.getElementById('bg-url-input').value);

            document.getElementById('letter-display').innerText = document.getElementById('letter-text').value;
            document.getElementById('bg-image').style.backgroundImage = `url('${document.getElementById('bg-url-input').value}')`;

            const fullUrl = `${window.location.origin}${window.location.pathname}?msg=${text}&bg=${bg}`;

            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = "";
            new QRCode(qrDiv, { text: fullUrl, width: 128, height: 128 });
            alert("Đã lưu! Hãy quét mã QR vừa tạo bên dưới để gửi link này cho bạn ấy.");
        });
    </script>
</body>
</html>
