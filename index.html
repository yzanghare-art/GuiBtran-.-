<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Btran ❤️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        /* Nền hình ảnh */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: brightness(0.75);
            z-index: 1;
            transition: background-image 0.5s ease;
        }

        /* Hiệu ứng trái tim rơi */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 2;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) scale(0); opacity: 1; }
            100% { transform: translateY(105vh) scale(1.5); opacity: 0; }
        }

        /* Khung giao diện chính */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #d63384;
            margin-bottom: 25px;
            font-size: 2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 100px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        #btn-yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }

        #btn-yes:hover {
            background-color: #ff758f;
            transform: scale(1.05);
        }

        #btn-no {
            background-color: #6c757d;
            color: white;
            position: relative;
            transition: all 0.2s ease;
        }

        /* Giao diện Tâm Tư */
        #letter-view {
            display: none;
        }

        #letter-text {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 2px solid #ffb3c1;
            border-radius: 12px;
            font-size: 1rem;
            resize: none;
            outline: none;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9);
        }

        .letter-content {
            font-size: 1.1rem;
            color: #4a4a4a;
            line-height: 1.6;
            white-space: pre-wrap;
            margin-bottom: 20px;
            text-align: left;
            max-height: 200px;
            overflow-y: auto;
        }

        /* Bảng điều khiển Tùy chỉnh & QR */
        .admin-panel {
            margin-top: 15px;
            border-top: 1px border #ccc;
            padding-top: 15px;
        }

        .input-group {
            margin-bottom: 10px;
            text-align: left;
        }

        .input-group label {
            font-size: 0.85rem;
            color: #666;
            display: block;
            margin-bottom: 3px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .btn-action {
            background: #590d22;
            color: white;
            font-size: 0.9rem;
            padding: 8px 15px;
            margin-top: 5px;
        }

        #qrcode {
            margin: 15px auto;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="bg-image"></div>

    <div class="container" id="question-view">
        <h1>Btran có iu tui hong? ❤️</h1>
        <div class="btn-group
